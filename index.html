<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E2748">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Waddle">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script>if("serviceWorker" in navigator&&location.protocol==="https:"||location.hostname==="localhost")addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})</script>
</head>
<body>
<title>Waddle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: storybook stickers on a pink polka-dot page. Thick plum outlines and hard drop shadows, rounded Fredoka for headings and buttons, Andika (single-storey a and g) for anything she reads, Atkinson for grown-up notes. */
:root{
  --bg:#FFD9E6; --dots:#FFC4D8; --card:#FFFFFF; --soft:#FFEFF5;
  --ink:#3A1730; --muted:#7A4D68; --edge:#3A1730; --shadow:#3A1730; --hair:#F3C6D7;
  --accent:#E0336F; --on-accent:#FFFFFF;
  --hl:#FFD43B; --hl-ink:#3A1730;
  --good:#1E9B68; --mid:#7C5AD8; --help:#EE6A30; --on-btn:#FFFFFF;
  --alien:#7C5AD8; --warn:#C98A00; --grown:#FFD43F; --grown-wing:#F2B400;
  --hb-sepal:#DE6E98; --hb-speck:#9A2C5C; --hb-vein:#B8467A; --hb-leaf:#5E9E6E; --hb-leaf-vein:#3E7550; --hb-stem:#6DAA72; --hb-nect:#A3CF6E; --hb-carpel:#7DB35A;
  --duck:#FFE14D; --wing:#F7C600; --beak:#F7811E; --duck-line:#3A1730; --mama:#FFC21A; --mama-wing:#E9A400; --bow:#E0336F;
  --font-child:"Andika","Century Gothic","Comic Sans MS",system-ui,sans-serif;
  --font-head:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --font-adult:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#2A1222; --dots:#34182B; --card:#3C1C33; --soft:#4A2441;
  --ink:#FFE9F2; --muted:#E3B2C9; --edge:#FF9EC2; --shadow:#12050D; --hair:#5A2E4D;
  --accent:#FF6FA1; --on-accent:#2A1222;
  --hl:#FFD43B; --hl-ink:#3A1730;
  --good:#45CF95; --mid:#AE92FF; --help:#FF9B66; --on-btn:#2A1222;
  --alien:#C2AEFF; --warn:#FFC94D; --bow:#FF6FA1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2A1222; --dots:#34182B; --card:#3C1C33; --soft:#4A2441;
  --ink:#FFE9F2; --muted:#E3B2C9; --edge:#FF9EC2; --shadow:#12050D; --hair:#5A2E4D;
  --accent:#FF6FA1; --on-accent:#2A1222;
  --hl:#FFD43B; --hl-ink:#3A1730;
  --good:#45CF95; --mid:#AE92FF; --help:#FF9B66; --on-btn:#2A1222;
  --alien:#C2AEFF; --warn:#FFC94D; --bow:#FF6FA1; color-scheme:dark}

body{background-color:var(--bg);background-image:radial-gradient(var(--dots) 18%,transparent 19%);background-size:28px 28px;
  color:var(--ink);font-family:var(--font-adult);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 44px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:2px}
.eyebrow{font:600 13px var(--font-head);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--font-head);font-weight:600;font-size:34px;line-height:1.1;margin:0;text-wrap:balance}
h2{font:600 21px/1.2 var(--font-head);margin:0;text-wrap:balance}
h3{font:600 16px var(--font-head);margin:0}
p{margin:0}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:18px}
.tabs{display:flex;gap:6px;background:var(--card);border:3px solid var(--edge);border-radius:999px;padding:5px;box-shadow:4px 4px 0 var(--shadow)}
.tabs button{flex:1;min-width:0;border:0;background:transparent;color:var(--muted);font:600 16px var(--font-head);padding:9px 6px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
button{font-family:var(--font-head)}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.btn{border:3px solid var(--edge);border-radius:999px;padding:12px 22px;font:600 18px var(--font-head);cursor:pointer;background:var(--accent);color:var(--on-accent);box-shadow:4px 4px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.small{padding:7px 14px;font-size:15px;box-shadow:3px 3px 0 var(--shadow)}

.panel{background:var(--card);border:3px solid var(--edge);border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:6px 6px 0 var(--shadow)}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--font-child);font-size:22px;padding:1px 13px;border-radius:12px;background:var(--soft);border:2px solid var(--hair)}
.chip .tag{font:600 11px var(--font-head);text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-left:6px;vertical-align:middle}
.chip.alien{border-color:var(--alien);color:var(--alien)}
.chip.snd{background:var(--hl);color:var(--hl-ink);border-color:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Ducklings */
.pond{display:flex;flex-direction:column;gap:10px}
.ducks{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px 0;padding:6px 4px 8px;border-bottom:4px dotted var(--hair)}
.duck{width:38px;height:34px;flex:none}
.duck.mama{width:62px;height:56px;margin-right:4px}
.duck svg{width:100%;height:100%;display:block;overflow:visible}
.d-body{fill:var(--duck);stroke:var(--duck-line);stroke-width:1.6;stroke-linejoin:round}
.d-body.m{fill:var(--mama)}
.d-wing{fill:var(--wing);stroke:var(--duck-line);stroke-width:1.2}
.d-wing.m{fill:var(--mama-wing)}
.d-beak,.d-feet{fill:var(--beak);stroke:var(--duck-line);stroke-width:1.2;stroke-linejoin:round}
.d-eye{fill:var(--duck-line)}
.d-bow{fill:var(--bow);stroke:var(--duck-line);stroke-width:1}
.ducks .more{font:600 15px var(--font-head);color:var(--muted);align-self:center;padding-left:6px}
@media (prefers-reduced-motion:no-preference){
  .duck:not(.mama){animation:bob 2.4s ease-in-out infinite;animation-delay:calc(var(--i,0) * -.3s)}
  .ducks .duck.mama{transform-origin:50% 100%;animation:mamasway 2.2s ease-in-out infinite alternate}
  .ducks .duck.mama svg{animation:mamahop 1.1s ease-in-out infinite alternate}
  @keyframes mamasway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
  @keyframes mamahop{from{transform:translateY(0)}to{transform:translateY(-3px)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .duck.new{animation:waddle .9s ease-out both,bob 2.4s ease-in-out .9s infinite}
  @keyframes waddle{0%{transform:translateX(40px) rotate(0);opacity:0}25%{opacity:1;transform:translateX(26px) rotate(10deg)}50%{transform:translateX(13px) rotate(-10deg)}75%{transform:translateX(5px) rotate(8deg)}100%{transform:none}}
}

/* Flashcards */
.count{font:600 15px var(--font-head);color:var(--ink);background:var(--card);border:2px solid var(--edge);border-radius:999px;padding:3px 12px;font-variant-numeric:tabular-nums}
.flash{background:var(--card);border:3px solid var(--edge);border-radius:30px;padding:26px 16px 24px;display:flex;flex-direction:column;align-items:center;gap:20px;box-shadow:7px 7px 0 var(--shadow)}
.kind{font:600 13px var(--font-head);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:6px}
.kind.alien{color:var(--alien)}
.kind svg{width:24px;height:24px}
.word{display:flex;align-items:flex-start;justify-content:center;gap:.04em;font-family:var(--font-child);font-size:clamp(64px,19vw,140px);line-height:1.05;max-width:100%;flex-wrap:nowrap;color:var(--ink)}
.word.solo{font-size:clamp(96px,30vw,190px)}
.g{display:flex;flex-direction:column;align-items:center;gap:10px;border-radius:.14em;padding:0 .05em;font:inherit;color:inherit;background:transparent;border:0}
button.g{cursor:pointer;-webkit-tap-highlight-color:transparent}
.letters{display:block;line-height:1.25}
.flash .word{background:var(--soft);border:3px solid var(--hair);border-radius:.28em;padding:.08em .28em .16em;box-sizing:border-box}
.word.solo{height:1.55em;min-width:1.55em;padding:0 .32em;align-items:center;justify-content:center}
.word.solo .g{padding:0}
.word.solo .letters{line-height:1}
.mark{display:flex;gap:.18em;justify-content:center;height:14px;align-items:center}
.dot{width:14px;height:14px;border-radius:50%;background:var(--ink)}
.bar{width:.9em;height:7px;border-radius:4px;background:var(--ink)}
.say{font:600 16px/1.2 var(--font-head);white-space:nowrap;visibility:hidden;color:var(--ink)}
.word.revealed .g.tricky{background:var(--hl);color:var(--hl-ink)}
.word.revealed .g.tricky .dot,.word.revealed .g.tricky .bar{background:var(--hl-ink)}
.word.revealed .g.tricky .say{visibility:visible;color:var(--hl-ink)}
.word:not(.marks) .mark{visibility:hidden}
.g.lit{background:var(--hl);color:var(--hl-ink)}
.g.lit .dot,.g.lit .bar{background:var(--accent)}
.sweep{width:min(78%,500px);height:9px;border-radius:5px;background:var(--hair);position:relative}
.sweep.on{background:var(--accent)}
.sweep::after{content:"";position:absolute;right:-10px;top:50%;transform:translateY(-50%);border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:14px solid var(--hair)}
.sweep.on::after{border-left-color:var(--accent)}
.tip{font-size:15px;color:var(--muted);text-align:center;max-width:46ch}
.grades{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:12px}
.grades button{border:3px solid var(--edge);border-radius:20px;padding:12px 8px;font:600 17px/1.2 var(--font-head);color:var(--on-btn);cursor:pointer;min-height:66px;box-shadow:4px 4px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.grades button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.g-auto{background:var(--good)}.g-sound{background:var(--mid)}.g-help{background:var(--help)}
@media (max-width:420px){.grades{grid-template-columns:1fr}.grades button{min-height:54px}}

/* Lists and settings */
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{background:var(--card);border:3px solid var(--edge);border-radius:20px;padding:10px 14px;display:flex;flex-direction:column;gap:0;min-width:0;box-shadow:4px 4px 0 var(--shadow)}
.stat b{font:600 30px/1.1 var(--font-head);font-variant-numeric:tabular-nums;color:var(--accent)}
.stat span{font-size:13px;color:var(--muted)}
.group{display:flex;flex-direction:column;gap:8px;padding-block:14px;border-top:2px dashed var(--hair)}
.group:first-of-type{border-top:0;padding-top:0}
.group h3 .hlt{background:var(--hl);color:var(--hl-ink);padding:0 7px;border-radius:6px;font-family:var(--font-child)}
.group p{font-size:14px;color:var(--muted);max-width:60ch}
.wrow{display:flex;align-items:center;gap:12px;padding:5px 0}
.wrow .w{font-family:var(--font-child);font-size:28px;min-width:3.2em}
.wrow .st{flex:1;min-width:0;font-size:13px;color:var(--muted)}
.pips{display:inline-flex;gap:3px;margin-right:8px;vertical-align:middle}
.pip{width:10px;height:10px;border-radius:50%;background:var(--hair)}
.pip.on{background:var(--good)}
.switch{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
.switch input{width:22px;height:22px;accent-color:var(--accent);cursor:pointer;flex:none}
.gset{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-top:2px dashed var(--hair)}
.gset:first-of-type{border-top:0;padding-top:0}
.gset-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.gtoggles{display:flex;flex-wrap:wrap;gap:8px}
.gt{font-family:var(--font-child);font-size:24px;min-width:56px;padding:3px 12px;border-radius:14px;border:3px solid var(--hair);background:var(--soft);color:var(--muted);cursor:pointer}
.gt[aria-pressed="true"]{background:var(--accent);border-color:var(--edge);color:var(--on-accent);box-shadow:3px 3px 0 var(--shadow)}
.linkbtn{background:none;border:0;color:var(--accent);font:600 15px var(--font-head);cursor:pointer;padding:4px}
.blist{display:flex;flex-direction:column}
.brow{display:flex;align-items:center;gap:12px;padding:6px 0;border-top:2px dashed var(--hair);flex-wrap:wrap}
.brow:first-child{border-top:0}
.brow .w{font-family:var(--font-child);font-size:24px;min-width:3.4em}
.badge{font:600 13px var(--font-head);padding:2px 10px;border-radius:999px;white-space:nowrap}
.badge.ready{background:var(--good);color:var(--on-btn)}
.badge.wait{background:var(--soft);color:var(--muted);border:2px solid var(--hair)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font:600 15px var(--font-head)}
.field input,.field textarea{font:16px var(--font-adult);padding:10px 12px;border-radius:14px;border:3px solid var(--hair);background:var(--soft);color:var(--ink);width:100%;box-sizing:border-box}
.field textarea{min-height:84px;resize:vertical}
.field select{font:16px var(--font-adult);padding:10px 12px;border-radius:14px;border:3px solid var(--hair);background:var(--soft);color:var(--ink);width:100%;box-sizing:border-box}
.setup{max-width:560px;margin:0 auto;gap:18px}
.setup .brand{display:flex;flex-direction:column;gap:4px}
.setup .brand b{font:600 26px/1 var(--font-head);color:var(--accent)}
.setup h1{font:600 clamp(28px,6vw,36px)/1.1 var(--font-head);margin:6px 0 0}
.setup .go{align-self:flex-start;font-size:20px;padding:14px 36px}
.tipbox{background:var(--soft);border-radius:16px;padding:12px 14px;font:15px/1.45 var(--font-adult);color:var(--ink)}
.restorebox:empty{display:none}
.restorebox{background:var(--soft);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.textbackup summary{cursor:pointer;font:600 15px var(--font-head);color:var(--muted)}
.textbackup[open]{display:flex;flex-direction:column;gap:10px}
.note{font-size:13px;color:var(--muted)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn.danger{background:var(--help);color:var(--on-btn)}
details.panel:not([open]){gap:0}
details.panel summary{cursor:pointer;font:600 17px var(--font-head)}
.bookpanel summary .opt{font:400 14px var(--font-adult);color:var(--muted)}
.done-title{font:600 30px/1.15 var(--font-head)}
@media (prefers-reduced-motion:no-preference){
  .flash{animation:pop .25s ease-out}
  @keyframes pop{from{transform:scale(.96) rotate(-1deg);opacity:.6}to{transform:none;opacity:1}}
  .g,.sweep{transition:background-color .15s}
}
.top{display:flex;flex-direction:column;gap:16px}
.session .row{margin-top:auto}
.cardview{display:flex;flex-direction:column;gap:14px}
.side{display:flex;flex-direction:column;gap:12px}
.side .note{text-align:center}
.done{max-width:720px;width:100%;margin:0 auto;box-sizing:border-box}
.gsets{display:grid;grid-template-columns:1fr;gap:0}
.bwords{display:flex;flex-wrap:wrap;gap:8px}
.bw{display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 12px 5px;border-radius:14px;border:3px solid var(--good);background:var(--card);min-width:64px}
.bw .w{font-family:var(--font-child);font-size:24px;line-height:1.2}
.bw .s{font:600 11px var(--font-head);letter-spacing:.04em;text-transform:uppercase;color:var(--good);white-space:nowrap}
.bw.wait{border:3px dashed var(--hair);background:var(--soft)}
.bw.wait .w{color:var(--muted)}
.bw.wait .s{color:var(--muted)}
.cols{display:flex;flex-direction:column;gap:18px;min-width:0}
.soundsgrid{display:flex;flex-direction:column;gap:18px}
@media (min-width:900px){
  .wrap{max-width:1120px;gap:22px}
  .top{flex-direction:row;justify-content:space-between;align-items:flex-end;gap:24px}
  .tabs{width:460px;flex:none}
  .start{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;align-items:stretch}
  .start>.pond,.start>details{grid-column:1/-1}
  .cardview{display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-areas:"top top" "flash side";gap:18px 26px;align-items:start}
  .cardview>.top-row{grid-area:top}
  .cardview>.flash{grid-area:flash;min-height:min(56vh,480px);justify-content:center}
  .cardview>.side{grid-area:side;align-self:center}
  .side .grades{grid-template-columns:1fr}
  .side .grades button{min-height:76px;font-size:19px}
  .soundsgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
  .gsets{grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 18px}
  .gsets .gset{border-top:0;padding-top:4px}
  .groups{columns:3;column-gap:30px}
  .groups .group{break-inside:avoid;border-top:0;padding-top:0;padding-bottom:18px}
}
@media (min-width:600px) and (max-width:899px){.gsets{grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}.groups{columns:2;column-gap:24px}.groups .group{break-inside:avoid}}
/* Grown-ups */
.tabs .lock{width:14px;height:14px;margin-right:6px;vertical-align:-1px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.subtabs button[role="tab"]{border:3px solid var(--edge);background:var(--card);color:var(--ink);font:600 15px var(--font-head);padding:6px 14px;border-radius:999px;cursor:pointer}
.subtabs button[aria-selected="true"]{background:var(--ink);color:var(--card)}
.lockbtn{margin-left:auto}
.linkbtn.due::after{content:"";display:inline-block;width:8px;height:8px;margin-left:6px;border-radius:50%;background:var(--accent);vertical-align:middle}
.panel.remind{border-color:var(--accent)}
.gate{max-width:460px;width:100%;margin:0 auto;align-items:center;text-align:center}
.gate-form{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.gate-q{font:600 30px var(--font-head)}
.gate-form input{font:600 26px var(--font-head);width:3.2em;text-align:center;padding:6px;border-radius:14px;border:3px solid var(--edge);background:var(--soft);color:var(--ink)}
.dash{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.dcol{display:flex;flex-direction:column;gap:18px;min-width:0}
.summary.four{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat .sub{font-size:12px;color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:3px}
.sday{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 0;border-radius:10px}
.sday.today{background:var(--soft)}
.smin{font:600 11px var(--font-head);color:var(--muted);min-height:14px;font-variant-numeric:tabular-nums}
.timeline{margin:0;font:15px/1.45 var(--font-adult);color:var(--ink)}
.mk{width:14px;height:14px;display:inline-block;border:2px solid var(--hair);box-sizing:border-box;flex:none}
.mk.p{border-radius:50%}.mk.p.on{background:var(--duck);border-color:var(--duck-line)}
.mk.r{border-radius:3px}.mk.r.on{background:var(--accent);border-color:var(--edge)}
.dow{font:600 11px var(--font-head);color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend>span{display:inline-flex;align-items:center;gap:6px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--hair);stroke-width:1}
.chart .base{stroke:var(--muted);stroke-width:1}
.chart text{fill:var(--muted);font:600 11px var(--font-head)}

const isSplit=id=>/^[aeiou]-e$/.test(gOf(id));

const BASE_MULTI=SETS.filter(s=>s.stage==="R").flatMap(s=>s.gs).filter(g=>g.length>1&&g!=="le");
const MULTI_R=[...new Set(BASE_MULTI)].sort((a,b)=>b.length-a.length);

/* ================= Maths: Mastering Number, Reception to end of Year 1 ================= */
function freshMaths(){return {settings:{max:5,speed:1500,acts:{},planKey:null},stats:{},cards:{},stage:-1,stageKey:null}}
const MS=()=>state.maths;
const mpick=a=>a[Math.floor(Math.random()*a.length)];
const range=(a,b)=>{const r=[];for(let i=a;i<=b;i++)r.push(i);return r};
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function mRecord(key,score){const st=MS().stats[key]||{r:[]};st.r=st.r.concat(score).slice(-6);MS().stats[key]=st;MS().cards=MS().cards||{};schedule(MS().cards,key,score===1?"up":score>0?"same":"reset")}
function mStatus(key){const st=MS().stats[key];if(!st||!st.r.length)return "none";const r=st.r;if(r[r.length-1]===0)return "help";if(r.length>=3&&r.slice(-3).every(x=>x===1))return "secure";return "going"}
function mWeight(key){const c=(MS().cards||{})[key];if(!c)return 3;if(c.due<=today())return 2+(5-c.box);return .4}
function wpickN(nums,prefix){const keys=nums.map(n=>prefix+":"+n),ws=keys.map(mWeight);let t=Math.random()*ws.reduce((a,b)=>a+b,0);for(let i=0;i<keys.length;i++){t-=ws[i];if(t<=0)return nums[i]}return nums[nums.length-1]}
function scatterPts(n,w,h,minD){
  for(let tries=0;tries<80;tries++){
    const pts=[];
    for(let i=0;i<n;i++){
      for(let k=0;k<100;k++){const p=[minD/2+Math.random()*(w-minD),minD/2+Math.random()*(h-minD)];
        if(pts.every(q=>Math.hypot(p[0]-q[0],p[1]-q[1])>=minD)){pts.push(p);break}}
    }
    if(pts.length===n)return pts;
  }
  return range(0,n-1).map(i=>[minD/2+(i%5)*minD,minD/2+Math.floor(i/5)*minD]);
}
function layoutsFor(n){if(n>5)return ["frame","beads","pairs"];const L=["line","pairs","frame","dice"];if(n<=5)L.push("scatter");if(n>=3)L.push("beads");return L}

/* What each activity is, and which term plan switches it on. Plans follow the NCETM Mastering Number overviews. */
const ACTS={
  sub:{name:"Quick look",desc:"Subitising. Dots flash up and ⟦she⟧ says how many. Above 5 they come in fives, so ⟦she⟧ sees 7 as 5 and 2.",per:3},
  cnt:{name:"Count the ducklings",desc:"Counting. ⟦She⟧ touches each duckling once, then says how many altogether.",per:2},
  comp:{name:"Numbers inside numbers",desc:"Composition. A number shown in two colours, so ⟦she⟧ sees 5 as 3 and 2.",per:2},
  cmp:{name:"Which has more?",desc:"Comparing. ⟦She⟧ taps the group with more.",per:1},
  num:{name:"Match the numeral",desc:"⟦She⟧ sees an amount and picks the written number that matches.",per:2},
  miss:{name:"Hiding ducklings",desc:"Missing parts. ⟦She⟧ knows the whole and works out how many are hiding.",per:2},
  dbl:{name:"Doubles",desc:"Two equal groups. Double 3 is 6.",per:1},
  more:{name:"One more, one less",desc:"⟦She⟧ finds the number one more or one less than a group.",per:2},
  oe:{name:"Odd or even?",desc:"Dots in pairs. Even numbers pair up with none left over.",per:1},
  story:{name:"Number stories",desc:"First, then, now. 'First there were 3. Then 2 more came. Now there are 5.'",per:2},
  b10:{name:"Make 10",desc:"A ten frame with some spaces. How many more to make 10?",per:2},
  teen:{name:"Ten and a bit",desc:"Teen numbers as a full ten and some more. 13 is 10 and 3.",per:2},
  line:{name:"Number line",desc:"⟦She⟧ places a number on a line from 0 to 20, using 5, 10 and 15 to help.",per:1},
  sum:{name:"Number sentences",desc:"Short addition and subtraction sentences within 10, with dots to help.",per:2},
  fing:{name:"Show me fingers",desc:"⟦She⟧ sees an amount and shows it on ⟦her⟧ fingers, ideally all at once rather than one finger at a time.",per:2},
  pat:{name:"What comes next?",desc:"Patterns. A repeating row of pictures, and ⟦she⟧ picks the one that comes next.",per:2}
};
const PLANS={
  "N-autumn":{max:3,acts:["sub","cnt","cmp","pat"]},
  "N-spring":{max:4,acts:["sub","cnt","fing","cmp","pat"]},
  "N-summer":{max:5,acts:["sub","cnt","fing","num","cmp","pat"]},
  "R-autumn":{max:5,acts:["sub","cnt","comp","cmp"]},
  "R-spring":{max:7,acts:["sub","num","miss","comp","dbl","cmp"]},
  "R-summer":{max:10,acts:["sub","cnt","more","oe","num","cmp"]},
  "Y1-autumn":{max:10,acts:["sub","comp","more","num","cmp"]},
  "Y1-spring":{max:10,acts:["comp","oe","story","b10","sub"]},
  "Y1-summer":{max:20,acts:["teen","line","story","sum","b10","oe"]}
};
function mathsPlanKey(){
  const school=planKey(),si=MPLAN_ORDER.indexOf(school),st=MS().stageKey?MPLAN_ORDER.indexOf(MS().stageKey):-1;
  return ownPace("maths")&&st>si?MPLAN_ORDER[st]:school;
}
function syncPlan(){
  const S=MS().settings,key=mathsPlanKey();
  if(S.planKey!==key){const P=PLANS[key];S.planKey=key;S.max=P.max;S.acts={};Object.keys(ACTS).forEach(a=>S.acts[a]=P.acts.includes(a))}
}
function resetPlan(){MS().settings.planKey=null;syncPlan();save();render()}
const mmax=()=>MS().settings.max;
const lim=n=>Math.min(mmax(),n);

function genItem(act){
  const max=mmax(),cap10=lim(10);
  switch(act){
    case "sub":{const n=wpickN(range(1,cap10),"sub"),lay=mpick(layoutsFor(n));return {kind:"msub",n,lay,pts:lay==="scatter"?scatterPts(n,5,3.2,1.2):null}}
    case "cnt":{const n=wpickN(range(MS().settings.planKey.startsWith("N")?2:Math.min(3,max),lim(12)),"cnt");return {kind:"mcnt",n,pts:scatterPts(n,6,3.4,n>8?.95:1.2)}}
    case "comp":{const pool=MS().settings.planKey==="Y1-spring"?[7,9,7,9,6,8,10].filter(x=>x<=cap10):range(2,cap10);const n=wpickN(pool,"comp"),a=rint(1,n-1);
      return {kind:"mcomp",n,a,lay:mpick(n<=6?["line","pairs","frame","dice"]:["line","pairs","frame"])}}
    case "cmp":{const l=rint(1,cap10);let r;do{r=rint(1,cap10)}while(r===l);return {kind:"mcmp",l,r,lp:scatterPts(l,3,3,l>6?.8:1.05),rp:scatterPts(r,3,3,r>6?.8:1.05)}}
    case "num":{const n=wpickN(range(1,cap10),"num");return {kind:"mch",act,n,lay:mpick(layoutsFor(n).filter(x=>x!=="scatter")),ans:n}}
    case "miss":{const n=wpickN(range(3,Math.min(max,MS().settings.planKey.startsWith("R")?5:10)),"miss"),k=rint(1,n-1);return {kind:"mch",act,n,k,ans:k}}
    case "dbl":{const k=wpickN(range(1,Math.min(5,Math.floor(lim(10)/2))),"dbl");return {kind:"mch",act,k,ans:k*2}}
    case "more":{const up=Math.random()<.5,n=up?rint(1,cap10-1):rint(2,cap10);return {kind:"mch",act,n,up,ans:up?n+1:n-1}}
    case "oe":{const n=rint(1,cap10);return {kind:"mch",act,n,ans:n%2?"Odd":"Even"}}
    case "story":{const plus=Math.random()<.55;if(plus){const a=rint(1,6),b=rint(1,Math.min(4,10-a));return {kind:"mch",act,a,b,plus,ans:a+b}}
      const a=rint(3,9),b=rint(1,Math.min(4,a-1));return {kind:"mch",act,a,b,plus,ans:a-b}}
    case "b10":{const n=wpickN(range(1,9),"b10");return {kind:"mch",act,n,ans:10-n}}
    case "teen":{const n=wpickN(range(11,19),"teen");return {kind:"mch",act,n,ans:n}}
    case "line":{let n;do{n=rint(1,19)}while(n%5===0);return {kind:"mline",act,n}}
    case "fing":{const n=wpickN(range(1,Math.min(max,5)),"fing");return {kind:"mfing",n}}
    case "pat":{const sets=[["🔴","🟡","🔵"],["⭐","🌙","☀️"],["🦆","🐸","🐟"],["🍎","🍌","🍐"],["🟩","🟪","🟧"]];const st=shuffle(mpick(sets));
      const units=MS().settings.planKey==="N-summer"?[[0,1],[0,0,1],[0,1,1],[0,1,2]]:[[0,1],[0,1],[0,0,1]];const u=mpick(units),len=u.length===2?6:u.length===3?6:5;
      const seq=range(0,len-1).map(i=>st[u[i%u.length]]),ans=st[u[len%u.length]];return {kind:"mch",act,seq,ans,opts:shuffle(st.slice(0,3))}}
    case "sum":{const plus=Math.random()<.6;if(plus){const a=rint(1,7),b=rint(1,10-a);return {kind:"mch",act,a,b,plus,ans:a+b}}
      const a=rint(3,10),b=rint(1,a-1);return {kind:"mch",act,a,b,plus,ans:a-b}}
  }
}
function planMaths(){
  syncPlan();
  const S=MS().settings,P=PLANS[S.planKey],order=[...P.acts,...Object.keys(ACTS).filter(a=>!P.acts.includes(a))].filter(a=>S.acts[a]);
  const q=[];
  const per=a=>S.planKey.startsWith("N")&&a==="sub"?2:ACTS[a].per;
  /* Never show the same amount twice in one activity: draw again until it differs */
  const keyOf=(a,x)=>a+":"+(x.kind==="mcmp"?Math.min(x.l,x.r)+"-"+Math.max(x.l,x.r):x.n!=null?x.n:[x.k,x.a,x.b,x.plus,x.up,x.seq&&x.seq.join("")].join(","));
  const used=new Set();
  const gen=a=>{let it;for(let t=0;t<25;t++){it=genItem(a);if(!used.has(keyOf(a,it)))break}used.add(keyOf(a,it));return it};
  order.forEach(a=>{for(let i=0;i<per(a)&&q.length<10;i++)q.push(gen(a))});
  /* quick looks first as a warm-up, which-has-more last; no two neighbours show the same number */
  const out=[];
  [q.filter(x=>x.kind==="msub"),q.filter(x=>x.kind!=="msub"&&x.kind!=="mcmp"),q.filter(x=>x.kind==="mcmp")].forEach(pool=>{
    while(pool.length){const last=out[out.length-1];let i=pool.findIndex(x=>!last||x.n==null||x.n!==last.n);if(i<0)i=0;out.push(pool.splice(i,1)[0])}});
  return out;
}

/* ---------- pictures ---------- */
function dotsSVG(n,lay,{split=null,pts=null}={}){
  const u=46,r=u*.36;let W,H;const dots=[],extras=[];
  const fill=i=>split==null?"m-dot":(i<split?"m-dot":"m-dot b");
  if(lay==="beads"){
    const bu=u*.82,gap=u*1.6;W=10*bu+gap+u*.6;H=u*1.3;
    extras.push(svg("line",{class:"m-rod",x1:u*.1,x2:W-u*.1,y1:H/2,y2:H/2}));
    for(let i=0;i<10;i++){const x=u*.3+bu*i+bu/2+(i>=n?gap:0);
      dots.push(svg("circle",{class:i<5?"m-bead":"m-bead w",cx:x,cy:H/2,r:bu*.46}))}
  }else{
    let P,w,h;
    if(lay==="dice"){const D={1:[[1,1]],2:[[0,0],[2,2]],3:[[0,0],[1,1],[2,2]],4:[[0,0],[2,0],[0,2],[2,2]],5:[[0,0],[2,0],[1,1],[0,2],[2,2]],6:[[0,0],[0,1],[0,2],[2,0],[2,1],[2,2]]};P=D[n];w=3;h=3}
    else if(lay==="line"){P=range(0,n-1).map(i=>[i,0]);w=n;h=1}
    else if(lay==="pairs"){P=range(0,n-1).map(i=>[Math.floor(i/2),i%2]);w=Math.ceil(n/2);h=2}
    else if(lay==="frame"){const rows=mmax()>5||n>5?2:1;P=range(0,n-1).map(i=>[i%5,Math.floor(i/5)]);w=5;h=rows;
      for(let y=0;y<rows;y++)for(let x=0;x<5;x++)extras.push(svg("rect",{class:"m-cell",x:x*u+u*.1,y:y*u+u*.1,width:u*.92,height:u*.92,rx:6}))}
    else{P=pts;w=5;h=3.2}
    const off=lay==="scatter"?0:.5;
    W=w*u+u*.2;H=h*u+u*.2;
    P.forEach((p,i)=>dots.push(svg("circle",{class:fill(i),cx:(p[0]+off)*u+u*.1,cy:(p[1]+off)*u+u*.1,r})));
  }
  return svg("svg",{class:"m-dots",viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":"a picture of dots"},extras,dots);
}
function tenFrameSVG(n,{full=10}={}){
  const u=40,frames=Math.max(1,Math.ceil(n/10)),W=frames*5*u+(frames-1)*u*.6+8,H=2*u+8,g=[];
  for(let f=0;f<frames;f++)for(let c=0;c<10;c++){const x=4+f*(5*u+u*.6)+(c%5)*u,y=4+Math.floor(c/5)*u,i=f*10+c;
    g.push(svg("rect",{class:"m-cell",x,y,width:u-4,height:u-4,rx:6}));
    if(i<n)g.push(svg("circle",{class:"m-dot",cx:x+(u-4)/2,cy:y+(u-4)/2,r:u*.32}))}
  return svg("svg",{class:"m-dots",viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":"ten frames"},g);
}

function numberOptions(ans,lo=0,hi=20){
  const set=new Set([ans]);const near=[ans-1,ans+1,ans-2,ans+2,ans+3].filter(x=>x>=lo&&x<=hi);
  for(const x of shuffle(near)){if(set.size>=3)break;set.add(x)}
  while(set.size<3)set.add(rint(lo,hi));
  return shuffle([...set]);
}

      return {kind:"Hiding ducklings",visual:v,q:`There are ${item.n} ducklings. How many are hiding in the reeds?`,tip:"⟦She⟧ knows the whole and can see one part, so the hiding part is what's left. Fingers help: hold up the whole, fold down the ones ⟦she⟧ can see.",opts:numberOptions(item.ans,1,item.n),key:"miss:"+item.n}}

    case "more":return {kind:"One more, one less",visual:tenFrameSVG(item.n),q:`What is one ${item.up?"more":"less"} than this?`,tip:`First ⟦she⟧ says how many there are, then imagines one ${item.up?"more counter added":"counter taken away"}.`,opts:numberOptions(item.ans,0,Math.max(10,S.max)),key:"more:"+item.n};

        el("div",{class:"spanel"},el("span",{class:"slabel",text:"First"}),duckGroup(item.a)),

        el("div",{class:"spanel"},el("span",{class:"slabel",text:"Then"}),item.plus?el("div",{class:"dgroup"},el("span",{class:"plus",text:"+"}),...range(1,item.b).map(()=>duckSpan())):el("div",{class:"dgroup"},...range(1,item.a).map((x,i)=>duckSpan(i>=item.a-item.b?"gone":"")))));
      const q=item.plus?`First there were ${item.a} ducklings. Then ${item.b} more came. How many are there now?`:`First there were ${item.a} ducklings. Then ${item.b} swam away. How many are there now?`;
      return {kind:"Number story",visual:v,q,tip:"Read the story aloud: first, then, now. ⟦She⟧ can use the picture or ⟦her⟧ fingers.",opts:numberOptions(item.ans,0,10),key:"story"}}

const TERMS=[
  ["Phoneme","","The smallest sound in a spoken word. ‘Ship’ has three phonemes, ‘sh’, ‘i’ and ‘p’. English has about 44."],
  ["Grapheme","sh","The letter or letters that write one phoneme. In ‘ship’, ‘sh’ is a single grapheme made of two letters."],
  ["GPC","","Short for grapheme–phoneme correspondence, the link between a written grapheme and the sound it stands for. Learning GPCs is the heart of phonics."],
  ["Digraph","ck ll ee","Two letters that make one sound."],
  ["Trigraph","igh ear","Three letters that make one sound. These start in Phase 3."],
  ["Split digraph","a-e","Two letters working together with another letter between them, as in ‘make’. These come in Year 1."],
  ["Vowel and consonant","","The vowels are a, e, i, o and u. Every other letter is a consonant."],
  ["CVC word","sat pin","A consonant, a vowel and a consonant. Most early Phase 2 words follow this pattern."],
  ["Adjacent consonants","stop damp","Two consonants side by side, each keeping its own sound. School teaches these properly in Phase 4. The app calls them two consonants together."],
  ["Pure sounds","","Saying a sound without adding ‘uh’. Say ‘mmm’, not ‘muh’, and a short ‘t’, not ‘tuh’. Pure sounds are what make blending work, because ‘c-a-t’ blends into ‘cat’ but ‘cuh-a-tuh’ does not."],
  ["Blending","","Saying each sound in order and pushing them together to hear the word. This is how ⟦she⟧ reads."],
  ["Segmenting","","The reverse of blending. ⟦She⟧ hears a word and splits it into its sounds so ⟦she⟧ can spell it. This is how ⟦she⟧ will write."],
  ["Decoding","","Reading a written word by working out its sounds and blending them. Spelling is sometimes called encoding."],
  ["Sound buttons","","A dot under each single-letter sound and a line under each two-letter sound. ⟦She⟧ touches each one as ⟦she⟧ says the sound."],
  ["Tricky word","the","A common word with a spelling ⟦she⟧ hasn't been taught yet. School calls the unusual bit the tricky part. In ‘is’, the tricky part is the ‘s’, which says ‘z’."],
  ["Alien word","","A made-up word built from real sounds, such as ‘tib’ or ‘zort’. Also called pseudo-words or nonsense words."],
  ["Decodable book","","A book written almost entirely from sounds and tricky words ⟦she⟧ has already been taught, so ⟦she⟧ can read it ⟦herself⟧."],
  ["Fluency","","Reading accurately at a comfortable pace, without sounding out every word. Reading with expression is called prosody."],
  ["Comprehension","","Understanding what ⟦she⟧ has read. Talking about the story afterwards builds it."],
  ["Schwa","","The soft ‘uh’ sound in unstressed parts of words, such as the end of ‘the’ or the last ‘a’ in ‘banana’."],
  ["Phonics Screening Check","","A short one-to-one check in June of Year 1. Children read 40 words to a teacher, and half of them are alien words. The expected standard has been 32 out of 40 in recent years."],
  ["Mastery","","Knowing something well enough that it is accurate, automatic and still there after a break. The app checks all three before moving on, using a 90% threshold, the stricter end of what mastery learning research uses."],
  ["Automaticity","","Recognising a sound or word instantly, without sounding it out. It frees ⟦her⟧ attention for meaning, which is why 'straight away' is the answer that counts for moving on."],
  ["Spaced practice","","Coming back to something after a growing gap (2, 4, 7, then 14 days). Remembering after a gap is the best evidence that learning has stuck."],
  ["SSP","","Systematic synthetic phonics. Systematic means sounds are taught in a fixed order. Synthetic means children build words by blending sounds."]
];

function wordNode(parts,{marks=false,tap=false,onAll=null}={}){
  const wd=el("div",{class:"word"+(marks?" marks":"")});
  const nodes=[];
  parts.forEach(([g,label,kind,pair])=>{
    const mark=el("span",{class:"mark","aria-hidden":"true"});
    if(kind==="blend")mark.append(el("span",{class:"dot"}),el("span",{class:"dot"}));
    else if(kind==="split")mark.append(el("span",{class:"arc"}));
    else if(g.length>1)mark.append(el("span",{class:"bar"}));
    else mark.append(el("span",{class:"dot"}));
    const inner=[el("span",{class:"letters",text:g}),mark];
    if(!tap)inner.push(el("span",{class:"say",text:label||" "}));
    const node=el(tap?"button":"span",{class:"g"+(label?" tricky":"")+(kind==="split"?" split":""),...(tap?{type:"button","aria-label":"sound "+g}:{}),...(pair?{"data-pair":pair}:{})},inner);
    nodes.push(node);wd.append(node);
  });
  if(tap){
    nodes.forEach(n=>n.addEventListener("click",()=>{
      const on=!n.classList.contains("lit");
      (n.dataset.pair?nodes.filter(x=>x.dataset.pair===n.dataset.pair):[n]).forEach(x=>x.classList.toggle("lit",on));
      if(onAll)onAll(nodes.every(x=>x.classList.contains("lit")));
    }));
  }
  return wd;
}

  // Her reading book
  const has=S.book.words.length>0;
  const book=el("details",{class:"panel bookpanel"},el("summary",{},"⟦Her⟧ school book words",el("span",{class:"opt",text:has?` · ${S.book.words.length} added`:" · optional"})));
  if(has)book.open=true;
  const tIn=el("input",{id:"book-title",type:"text",maxlength:"80",placeholder:"e.g. Floppy's Phonics, book 3"});tIn.value=S.book.title||"";
  const wIn=el("textarea",{id:"book-words",spellcheck:"false",placeholder:"e.g. hen, peg, bed, ten"});wIn.value=S.book.words.join(", ");
  const saveBtn=el("button",{class:"btn small",on:{click:()=>{
    S.book.title=tIn.value.trim();
    S.book.words=[...new Set(wIn.value.toLowerCase().split(/[^a-z]+/).filter(Boolean))];
    rebuildReal();save();render();
  }}},"Save book words");
  const clearBtn=has?el("button",{class:"btn ghost small",on:{click:()=>{S.book.title="";S.book.words=[];rebuildReal();save();render()}}},"Clear for a new book"):null;
  book.append(el("p",{class:"note",text:"You don't need this. Practice already picks words from the sounds you tick. To focus on the book ⟦she⟧ brings home, add its words and up to 2 will join each session, with the end screen asking ⟦her-o⟧ to find them in the book."}),
    el("div",{class:"field"},el("label",{for:"book-title",text:"Book title (optional)"}),tIn),
    el("div",{class:"field"},el("label",{for:"book-words",text:"Words from the book, such as those in the reading notes"}),wIn),
    el("div",{class:"row"},saveBtn,clearBtn));
  const list=el("div",{class:"bwords"});
  S.book.words.forEach(w=>{
    const a=analyse(w),c=S.cards[w];
    const label=!a.ready?a.why.replace("Waiting for ","needs ").replace("Two consonants together","2 consonants").replace("Uses a spelling not in ⟦her⟧ sets","new spelling")
      :c?(c.box>=4?"on ⟦her⟧ own":"practising"):"ready";
    list.append(el("div",{class:"bw"+(a.ready?"":" wait"),title:a.why+(ORDER.includes(w)?" · also a tricky word":"")},
      el("span",{class:"w",text:w}),el("span",{class:"s",text:label})));
  });
  if(has)book.append(list,el("p",{class:"note",text:"Words waiting for a sound stay out of practice until you tick that sound. If one comes up while ⟦she⟧ reads the book, read it to ⟦her-o⟧."}));
  right.append(book);
  return wrap;
}

/* ----- Tricky words tab ----- */
function trickyView(){
  const counts={new:0,learning:0,secure:0};
  taughtTricky().forEach(w=>counts[trickyStatus(w)]++);
  const wrap=el("div",{class:"stack"});
  wrap.append(el("div",{class:"summary"},
    el("div",{class:"stat"},el("b",{text:String(counts.secure)}),el("span",{text:"Reads on sight"})),
    el("div",{class:"stat"},el("b",{text:String(counts.learning)}),el("span",{text:"Still learning"})),
    el("div",{class:"stat"},el("b",{text:String(counts.new)}),el("span",{text:"Not practised yet"}))));
  const list=el("section",{class:"panel"},
    el("p",{class:"muted",text:"Tick each tricky word once school has taught it. Only ticked words appear in practice."}));
  const terms=[...new Set(GROUPS.map(g=>g.term))];let groups=null;
  const termNow=curTermLabel();
  const blocks={};
  terms.forEach(t=>{const tw=GROUPS.filter(g=>g.term===t).flatMap(g=>g.words.map(x=>x[0]));const n=tw.filter(w=>state.taught[w]).length;
    const allOn=n===tw.length;
    const d=el("details",{class:"tblock"},el("summary",{},el("span",{text:t}),el("span",{class:"note",text:` ${n} of ${tw.length} ticked`})),
      el("button",{class:"linkbtn",on:{click:()=>{tw.forEach(w=>state.taught[w]=!allOn);save();render()}}},allOn?"Untick all":"Tick all"));
    if(t===termNow||(n>0&&n<tw.length))d.open=true;
    const gr=el("div",{class:"groups"});d.append(gr);blocks[t]=gr;list.append(d)});
  GROUPS.forEach(g=>{
    groups=blocks[g.term];
    const grp=el("div",{class:"group"},el("h3",{},el("span",{class:"hlt",text:g.hl})," ",g.term===g.title?"":g.title),el("p",{text:g.note}));
    g.words.forEach(([w])=>{
      const st=trickyStatus(w),c=state.cards[w];
      const pips=el("span",{class:"pips","aria-hidden":"true"});
      for(let i=1;i<=5;i++)pips.append(el("span",{class:"pip"+(c&&c.box>=i?" on":"")}));
      const label={off:"Not taught yet",new:"Not practised yet",learning:"Still learning",secure:"Reads on sight"}[st];
      const cb=el("input",{type:"checkbox",id:"taught-"+w});
      cb.checked=!!state.taught[w];
      cb.addEventListener("change",()=>{state.taught[w]=cb.checked;save();render()});
      grp.append(el("div",{class:"wrow"},el("span",{class:"w",text:w}),
        el("span",{class:"st"},st==="off"?null:pips,label),
        el("label",{class:"switch",for:"taught-"+w},cb,"Taught")));
    });
    groups.append(grp);
  });
  wrap.append(list);
  return wrap;
}

["practise","grown"].forEach(t=>document.getElementById("tab-"+t).addEventListener("click",()=>{if(t==="grown"&&session){releaseWake();session=null}tab=t;render()}));
/* Each new day, or after more than half an hour away, the app opens on the landing page again */
let shownDay=today(),hiddenAt=0;
function backToLanding(reason){
  if(session&&reason!=="newday")return;
  if(session){releaseWake();session=null}
  tab="practise";screen="landing";shownDay=today();render();
}
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){hiddenAt=Date.now();return}
  if(today()!==shownDay)backToLanding("newday");
  else if(hiddenAt&&Date.now()-hiddenAt>30*60*1000)backToLanding("away");
});
setInterval(()=>{if(!document.hidden&&today()!==shownDay)backToLanding("newday")},60*1000);
render();
connect();
</script>
